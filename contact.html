<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Contact - FitFlex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="container">
      <a href="index.html" class="logo">FitFlex</a>
      <nav>
        <ul>
          <li><a href="index.html">Exercises</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>Contact Us</h1>
    <p>Have a question? Send us a message below.</p>
  </section>

  <div class="container">

    <div class="contact-info">
      <p><strong>Email:</strong> akshit.chaudhary.25cse@bmu.edu.in</p>
      <p><strong>Phone:</strong> 9084955030</p>
      <p><strong>Address:</strong> BML Munjal University</p>
    </div>

    <form class="contact-form" onsubmit="return validateForm()">

      <label for="name">Name</label>
      <input type="text" id="name">

      <label for="email">Email</label>
      <input type="text" id="email">

      <label for="topic">Topic</label>
      <select id="topic">
        <option value="form">Question about form</option>
        <option value="request">Request an exercise</option>
        <option value="other">Something else</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" rows="5"></textarea>

      <button type="submit" class="btn">Send Message</button>

    </form>

  </div>

  <footer>
    <p>FitFlex - Exercise Library</p>
    <p>This site is for learning purposes only, not medical advice.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
